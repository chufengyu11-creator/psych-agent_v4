name: psych-agent-postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psych_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-psych_agent}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - psych_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  psych_agent_postgres_data:
