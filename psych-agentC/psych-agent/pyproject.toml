[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psych-support-agent"
version = "0.1.0"
description = "A stateful multi-session psychological support dialogue agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "api*",
    "orchestrator*",
    "agents*",
    "services*",
    "storage*",
    "schemas*",
    "llm*",
    "workers*",
    "evaluation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = [
    "storage/migrations/",
]

[[tool.mypy.overrides]]
module = [
    "redis.*",
]
ignore_missing_imports = true
