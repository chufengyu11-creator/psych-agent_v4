<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-label="串行与并行结构">

<style>
  .bg { fill: #ffffff; }
  .title { font: 700 24px Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
  .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.6; }
  .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; }
  .box-green { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.8; }
  .box-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.8; }
  .box-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; }
  .diamond { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; }
  .text { font: 15px Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #111827; }
  .small { font: 13px Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #475569; }
  .label { font: 13px Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #334155; }
  .arrow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 7 6; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
  </marker>
</defs>

<rect class="bg" width="1280" height="860"/>
<text class="title" x="32" y="42">串行与并行结构</text>
<rect class="lane" x="28" y="70" width="850" height="585" rx="12"/>
<text class="small" x="50" y="98">前台请求链路：用户等待回复</text>
<rect class="lane" x="910" y="70" width="330" height="360" rx="12"/>
<text class="small" x="932" y="98">后台 post_turn：不阻塞回复</text>
<rect class="lane" x="910" y="470" width="330" height="235" rx="12"/>
<text class="small" x="932" y="498">可选后台 deep state</text>
<rect class="box-blue" x="60" y="130" width="190" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="155.0" y="164.0">保存用户消息</tspan></text>
<rect class="box-blue" x="300" y="130" width="190" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="395.0" y="154.0">读取 state / recent</tspan><tspan x="395.0" y="174.0">messages</tspan></text>
<rect class="box-amber" x="540" y="130" width="190" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="635.0" y="164.0">feedback_evaluator</tspan></text>
<path class="arrow" d="M 250 159 L 300 159"/>
<path class="arrow" d="M 490 159 L 540 159"/>
<rect class="box-amber" x="300" y="245" width="190" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="395.0" y="269.0">并行区:</tspan><tspan x="395.0" y="289.0">asyncio.gather</tspan></text>
<path class="arrow" d="M 635 188 L 395 245"/>
<rect class="box-red" x="120" y="360" width="200" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="220.0" y="394.0">risk_agent</tspan></text>
<rect class="box-green" x="480" y="360" width="240" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="600.0" y="384.0">state_tracker /</tspan><tspan x="600.0" y="404.0">fast_state_tracker</tspan></text>
<path class="arrow" d=" M 395 303 L 220 303 L 220 360"/>
<path class="arrow" d=" M 395 303 L 600 303 L 600 360"/>
<rect class="box" x="300" y="500" width="220" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="410.0" y="534.0">state_reducer</tspan></text>
<path class="arrow" d=" M 220 418 L 220 529 L 300 529"/>
<path class="arrow" d=" M 600 418 L 600 529 L 520 529"/>
<rect class="box" x="590" y="500" width="190" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="685.0" y="534.0">保存 state</tspan></text>
<path class="arrow" d="M 520 529 L 590 529"/>
<polygon class="diamond" points="690,593.0 800.0,635 690,677.0 580.0,635"/><text class="text" text-anchor="middle"><tspan x="690.0" y="640.0">硬安全路由?</tspan></text>
<path class="arrow" d="M 685 558 L 685 593"/>
<rect class="box-red" x="430" y="720" width="210" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="535.0" y="754.0">SafetyRouter 固定回复</tspan></text>
<path class="arrow" d=" M 580 635 L 535 635 L 535 720"/>
<text class="label" x="550" y="626">是</text>
<rect class="box-blue" x="735" y="720" width="210" height="58" rx="10"/><text class="text" text-anchor="middle"><tspan x="840.0" y="744.0">strategy -&gt;</tspan><tspan x="840.0" y="764.0">response -&gt; guard</tspan></text>
<path class="arrow" d=" M 800 635 L 840 635 L 840 720"/>
<text class="label" x="812" y="626">否</text>
<rect class="box-green" x="560" y="800" width="250" height="50" rx="10"/><text class="text" text-anchor="middle"><tspan x="685.0" y="820.0">保存 assistant</tspan><tspan x="685.0" y="840.0">message</tspan></text>
<path class="arrow" d=" M 535 778 L 535 825 L 560 825"/>
<path class="arrow" d=" M 840 778 L 840 825 L 810 825"/>
<path class="arrow dash" d=" M 810 825 L 960 825 L 960 640 L 1030 640"/>
<rect class="box-amber" x="1000" y="140" width="200" height="52" rx="10"/><text class="text" text-anchor="middle"><tspan x="1100.0" y="171.0">post_turn queue</tspan></text>
<rect class="box" x="1000" y="230" width="200" height="52" rx="10"/><text class="text" text-anchor="middle"><tspan x="1100.0" y="261.0">rolling_summarizer</tspan></text>
<rect class="box-green" x="1000" y="320" width="200" height="52" rx="10"/><text class="text" text-anchor="middle"><tspan x="1100.0" y="341.0">memory_curator /</tspan><tspan x="1100.0" y="361.0">memory write</tspan></text>
<path class="arrow" d="M 1100 192 L 1100 230"/>
<path class="arrow" d="M 1100 282 L 1100 320"/>
<path class="arrow dash" d=" M 840 749 L 950 749 L 950 166 L 1000 166"/>
<rect class="box-amber" x="1000" y="535" width="200" height="52" rx="10"/><text class="text" text-anchor="middle"><tspan x="1100.0" y="556.0">deep_state task</tspan><tspan x="1100.0" y="576.0">queue</tspan></text>
<rect class="box" x="1000" y="625" width="200" height="52" rx="10"/><text class="text" text-anchor="middle"><tspan x="1100.0" y="646.0">deep state</tspan><tspan x="1100.0" y="666.0">extraction</tspan></text>
<path class="arrow" d="M 1100 587 L 1100 625"/>
<path class="arrow dash" d=" M 945 749 L 1080 749 L 1080 677"/>
</svg>